<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bluster Madness — Bluster Development</title>
  <desc id="desc">Black and red banner for a FiveM script developer, with a glowing B emblem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090e"/>
      <stop offset=".57" stop-color="#121016"/>
      <stop offset="1" stop-color="#260a11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5962"/>
      <stop offset=".55" stop-color="#ef263a"/>
      <stop offset="1" stop-color="#990d28"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e91d3e" stop-opacity=".42"/>
      <stop offset=".65" stop-color="#aa142b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#aa142b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="230" cy="176" rx="290" ry="290" fill="url(#glow)"/>
    <ellipse cx="1100" cy="330" rx="320" ry="260" fill="url(#glow)" opacity=".55"/>

    <g fill="none" stroke="#f43f55" opacity=".23">
      <path d="M930 -20 1230 280M1000 -40l300 300M1080 -40l300 300" stroke-width="2"/>
      <path d="M1010 360 1220 150M1080 360 1220 220" stroke-width="1"/>
    </g>
    <path d="M0 0H1200" stroke="#f43f55" stroke-width="5"/>
    <path d="M0 357H1200" stroke="#f43f55" stroke-opacity=".4" stroke-width="3"/>

    <circle cx="179" cy="177" r="117" fill="#e11d48" opacity=".45" filter="url(#softGlow)"/>
    <circle cx="179" cy="177" r="112" fill="#08090e" stroke="#fa4057" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="179" cy="177" r="99" fill="#131017" stroke="#ffffff" stroke-opacity=".11" stroke-width="2"/>
    <path d="M179 61 277 118V236L179 292 81 236V118Z" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M179 77 262 125V229L179 277 96 229V125Z" fill="none" stroke="#fa4057" stroke-opacity=".22" stroke-width="2"/>
    <path d="M125 122h55c43 0 54 44 26 61 35 15 26 62-24 62h-57v-123zm34 23v32h19c27 0 27-32 0-32h-19zm0 54v24h24c22 0 22-24 0-24h-24z" fill="url(#accent)"/>
    <path d="M65 177H24m310 0h-44" stroke="#fa4057" stroke-width="3"/>
    <circle cx="23" cy="177" r="5" fill="#ff5962"/>
    <circle cx="334" cy="177" r="5" fill="#ff5962"/>

    <text x="353" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#fb7185">BLUSTER MADNESS  /  FIVEM DEVELOPER</text>
    <text x="347" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="75" font-weight="900" letter-spacing="4" fill="#f8fafc">BLUSTER</text>
    <text x="349" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="69" font-weight="900" letter-spacing="2" fill="url(#accent)">DEVELOPMENT</text>
    <rect x="352" y="252" width="646" height="2" rx="1" fill="#fa4057" opacity=".55"/>
    <text x="351" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1.5" fill="#d7d7e1">FIVEM SCRIPTS   •   ROLEPLAY SYSTEMS   •   COMMUNITY</text>
    <text x="352" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="3.5" fill="#a0a0ae">MADE FOR SERVER OWNERS. BUILT FOR BETTER RP.</text>

    <path d="M1158 30h-52m52 0v52" fill="none" stroke="#fa4057" stroke-opacity=".6" stroke-width="3"/>
    <path d="M42 330h52M42 330v-52" fill="none" stroke="#fa4057" stroke-opacity=".35" stroke-width="3"/>
    <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#fc5267" stroke-opacity=".28" stroke-width="2"/>
  </g>
</svg>
